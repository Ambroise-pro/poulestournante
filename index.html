<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poules torunante VB</title>
    <!-- Chargement de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Police de base */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Masquer les écrans par défaut */
        .screen {
            display: none;
        }
        /* Afficher l'écran actif */
        .screen.active {
            display: block;
        }
        
        /* --- Style pour les modaux --- */
        .modal {
            display: none;
            transition: opacity 300ms ease-in-out;
        }
        .modal:not(.hidden) {
            display: flex;
        }
        
        .modal-panel {
            transition: all 300ms ease-in-out;
        }
        
        .player-pill {
            display: inline-block;
            background-color: #e0e7ff; /* indigo-100 */
            color: #3730a3; /* indigo-800 */
            padding: 2px 10px;
            border-radius: 9999px; /* rounded-full */
            font-size: 0.875rem; /* text-sm */
            font-weight: 500; /* medium */
            margin: 2px;
        }
        .player-pill-a {
            background-color: #e0e7ff; /* indigo-100 */
            color: #3730a3; /* indigo-800 */
        }
        .player-pill-b {
            background-color: #dcfce7; /* green-100 */
            color: #15803d; /* green-800 */
        }

        /* Animation de chargement */
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .player-pill-animated {
            animation: slide-in 0.5s ease-out forwards;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fade-in 0.4s ease-out;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Bandeau de reprise de session -->
    <div id="resume-banner" class="hidden fixed top-0 left-0 right-0 z-50 bg-indigo-700 text-white p-4 shadow-lg">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center max-w-5xl">
            <div class="text-center md:text-left mb-2 md:mb-0">
                <p class="font-semibold">Un tournoi est déjà en cours.</p>
                <p class="text-sm text-indigo-200">Voulez-vous le reprendre ?</p>
            </div>
            <div class="flex gap-4">
                <button id="resume-new-button" class="py-2 px-4 bg-slate-500 rounded-lg hover:bg-slate-600 transition-colors">
                    Commencer un nouveau
                </button>
                <button id="resume-continue-button" class="py-2 px-4 bg-white text-indigo-700 font-semibold rounded-lg hover:bg-gray-100 transition-colors">
                    Continuer
                </button>
            </div>
        </div>
    </div>

    <div class="container mx-auto p-4 md:p-8 lg:p-12 max-w-5xl mt-0 pt-16">

        <!-- Bandeau logo -->
        <div class="flex items-center justify-center gap-3 mb-8">
            <img src="logo.png" alt="Logo de l'application" class="h-14 w-auto rounded-lg shadow-sm">
            <div>
                <p class="text-xs font-semibold uppercase tracking-[0.18em] text-indigo-600">Poules tournantes VB</p>
            </div>
        </div>

        <!-- ÉCRAN 1: CONFIGURATION -->
        <div id="screen-setup" class="screen active bg-white p-6 md:p-8 rounded-2xl shadow-lg">
            <h1 class="flex items-center justify-center text-3xl font-bold text-center text-indigo-700 mb-8">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                Configuration du Tournoi
            </h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Choix du nombre de joueurs -->
                <div>
                    <label for="player-count" class="block text-lg font-medium text-slate-700 mb-2">
                        1. Nombre de joueurs
                    </label>
                    <select id="player-count" class="w-full p-3 border border-slate-300 rounded-lg text-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="6">6 Joueurs</option>
                        <option value="7">7 Joueurs</option>
                        <option value="8">8 Joueurs</option>
                        <option value="9">9 Joueurs</option>
                    </select>
                </div>
                <!-- Objectif de matchs -->
                <div>
                    <label for="match-target" class="block text-lg font-medium text-slate-700 mb-2">
                        2. Objectif de matchs
                    </label>
                    <input type="number" id="match-target" value="5" min="2" max="10" class="w-full p-3 border border-slate-300 rounded-lg text-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <!-- Réglages de barème -->
            <div class="mb-6">
                <label class="block text-lg font-medium text-slate-700 mb-3">
                    3. Barème de points
                </label>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="points-win" class="block text-sm font-medium text-slate-600 mb-1">Victoire</label>
                        <input type="number" id="points-win" value="3" min="0" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="points-draw" class="block text-sm font-medium text-slate-600 mb-1">Nul</label>
                        <input type="number" id="points-draw" value="2" min="0" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="points-loss" class="block text-sm font-medium text-slate-600 mb-1">Défaite</label>
                        <input type="number" id="points-loss" value="1" min="0" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <p class="text-xs text-slate-500 mt-2">Exemple : 3/2/1 ou 3/1/0 selon vos règles.</p>
            </div>

            <!-- Champs pour les noms des joueurs -->
            <div class="mb-6">
                <label class="block text-lg font-medium text-slate-700 mb-3">
                    4. Noms des joueurs
                </label>
                <div id="player-names-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Les champs seront insérés ici par JS -->
                </div>
            </div>

            <div id="setup-error" class="text-red-600 text-center font-medium mb-4 h-5"></div>
            
            <button id="start-button" class="w-full text-white text-xl font-semibold py-4 px-6 rounded-lg shadow-md transition-all duration-300
                            bg-gradient-to-r from-indigo-600 to-blue-500 hover:from-indigo-700 hover:to-blue-600 
                            focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Commencer le tournoi
            </button>
        </div>

        <!-- ÉCRAN 2: TABLEAU DE BORD PRINCIPAL -->
        <div id="screen-main" class="screen">
            <h1 class="flex items-center justify-center text-3xl font-bold text-center text-indigo-700 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-3"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 12h10M12 7v10"/></svg>
                Tableau de Bord
            </h1>
            
            <div id="generation-info" class="bg-indigo-50 text-indigo-700 p-4 rounded-lg text-center font-medium text-sm mb-8"></div>

            <div id="dashboard-content" class="hidden">
                <!-- Layout flex (mobile-first) -->
                <div class="flex flex-col-reverse lg:flex-row gap-8">
                    
                    <!-- Colonne Principale (Actions) -->
                    <div class="flex-1 flex flex-col gap-8">
                        <div class="bg-white p-6 rounded-2xl shadow-lg">
                            <h2 class="text-2xl font-semibold mb-5 text-slate-800">
                                Matchs à Jouer (<span id="matches-to-play-count">0</span>)
                            </h2>
                            <div id="matches-to-play-list" class="space-y-5 max-h-[70vh] overflow-y-auto pr-2"></div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-lg">
                            <h2 class="text-2xl font-semibold mb-5 text-slate-800">
                                Matchs Terminés (<span id="matches-played-count">0</span>)
                            </h2>
                            <div id="matches-played-list" class="space-y-4 max-h-[40vh] overflow-y-auto pr-2 text-sm text-slate-600"></div>
                        </div>
                    </div>
                    
                    <!-- Colonne Latérale (Classement) -->
                    <div class="w-full lg:w-2/5 xl:w-1/3">
                        <div class="bg-white p-6 rounded-2xl shadow-lg sticky top-16">
                            <div class="flex justify-between items-center mb-4 border-b pb-3">
                                <h2 class="text-2xl font-semibold text-slate-800">Classement</h2>
                                <button id="copy-scoreboard-button" title="Copier le classement" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-100 rounded-lg transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                </button>
                            </div>
                            <table class="w-full">
                                <thead>
                                    <tr class="border-b text-left text-slate-600">
                                        <th class="py-2 px-1">#</th>
                                        <th class="py-2 px-1">Joueur</th>
                                        <th id="wins-header" class="py-2 px-1 text-center">Pts</th>
                                        <th class="py-2 px-1 text-center" title="Goal Average">GA</th>
                                        <th class="py-2 px-1 text-center">Joués</th>
                                    </tr>
                                </thead>
                                <tbody id="scoreboard-body"></tbody>
                                <tfoot id="scoreboard-footer" class="hidden"></tfoot>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Footer et Boutons IA -->
                <div class="mt-12 text-center border-t border-slate-200 pt-8 space-y-4">
                    <button id="reset-button" class="text-slate-500 hover:text-red-600 hover:underline flex items-center justify-center gap-2 mx-auto">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        Recommencer (tout effacer)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE SAISIE DES SCORES -->
    <div id="score-modal" class="modal hidden fixed inset-0 z-50 items-center justify-center p-4 bg-black bg-opacity-60 opacity-0" onclick="closeScoreModal()">
        <div class="modal-panel bg-white w-full max-w-md p-6 rounded-2xl shadow-xl opacity-0 scale-95" onclick="event.stopPropagation()">
            <h3 id="modal-title" class="text-2xl font-semibold mb-6 text-slate-800">Saisir le score</h3>
            <div class="space-y-4">
                <div>
                    <label id="modal-team-a-name" for="modal-score-a" class="block text-sm font-medium text-indigo-700 mb-1">Équipe A</label>
                    <input type="number" id="modal-score-a" min="0" placeholder="Score A" class="mt-1 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label id="modal-team-b-name" for="modal-score-b" class="block text-sm font-medium text-green-700 mb-1">Équipe B</label>
                    <input type="number" id="modal-score-b" min="0" placeholder="Score B" class="mt-1 w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:outline-none">
                </div>
            </div>
            <div id="modal-error" class="text-red-600 text-sm font-medium mt-4 h-5"></div>
            <div class="flex justify-end gap-4 mt-6">
                <button id="modal-cancel-button" class="py-2 px-5 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition-colors">Annuler</button>
                <button id="modal-confirm-button" class="py-2 px-5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">Confirmer</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE STATS JOUEUR -->
    <div id="stats-modal" class="modal hidden fixed inset-0 z-50 items-center justify-center p-4 bg-black bg-opacity-60 opacity-0" onclick="closeStatsModal()">
        <div class="modal-panel bg-white w-full max-w-lg p-6 rounded-2xl shadow-xl max-h-[80vh] overflow-y-auto opacity-0 scale-95" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h3 id="stats-modal-title" class="text-2xl font-semibold text-slate-800">Statistiques du Joueur</h3>
                <button id="stats-modal-close" class="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <!-- Conteneur pour le contenu dynamique -->
            <div id="stats-modal-content" class="space-y-3 mb-6"></div>
        </div>
    </div>

    <script>
        // --- VARIABLES GLOBALES ---
        let allPlayers = []; 
        let selectedMatchesForTournament = [];
        let MIN_MATCH_TARGET = 5; 
        let pointsConfig = { win: 3, draw: 2, loss: 1 };
        let currentMatchIdToScore = null;
        let justFinishedMatchId = null;

        // --- ÉLÉMENTS DU DOM ---
        const screens = { setup: document.getElementById('screen-setup'), main: document.getElementById('screen-main') };
        const playerCountSelect = document.getElementById('player-count');
        const matchTargetInput = document.getElementById('match-target');
        const pointsWinInput = document.getElementById('points-win');
        const pointsDrawInput = document.getElementById('points-draw');
        const pointsLossInput = document.getElementById('points-loss');
        const playerNamesContainer = document.getElementById('player-names-container');
        const setupError = document.getElementById('setup-error');
        const startButton = document.getElementById('start-button');
        const resetButton = document.getElementById('reset-button');
        
        const dashboardContent = document.getElementById('dashboard-content');
        const generationInfo = document.getElementById('generation-info');
        const scoreboardBody = document.getElementById('scoreboard-body');
        const matchesToPlayList = document.getElementById('matches-to-play-list');
        const matchesPlayedList = document.getElementById('matches-played-list');
        const matchesToPlayCount = document.getElementById('matches-to-play-count');
        const matchesPlayedCount = document.getElementById('matches-played-count');
        const copyScoreboardButton = document.getElementById('copy-scoreboard-button');

        // Modaux
        const scoreModal = document.getElementById('score-modal');
        const scoreModalPanel = scoreModal.querySelector('.modal-panel');
        const modalTitle = document.getElementById('modal-title');
        const modalTeamAName = document.getElementById('modal-team-a-name');
        const modalScoreA = document.getElementById('modal-score-a');
        const modalTeamBName = document.getElementById('modal-team-b-name');
        const modalScoreB = document.getElementById('modal-score-b');
        const modalError = document.getElementById('modal-error');
        const modalConfirmButton = document.getElementById('modal-confirm-button');
        const modalCancelButton = document.getElementById('modal-cancel-button');
        
        const statsModal = document.getElementById('stats-modal');
        const statsModalPanel = statsModal.querySelector('.modal-panel');
        const statsModalTitle = document.getElementById('stats-modal-title');
        const statsModalContent = document.getElementById('stats-modal-content');
        const statsModalCloseButton = document.getElementById('stats-modal-close');
        
        // Bandeau
        const resumeBanner = document.getElementById('resume-banner');
        const resumeContinueButton = document.getElementById('resume-continue-button');
        const resumeNewButton = document.getElementById('resume-new-button');


        // --- LOGIQUE DE PERSISTANCE (localStorage) ---
        function saveState() {
            try {
                const state = { allPlayers, selectedMatchesForTournament, MIN_MATCH_TARGET, pointsConfig };
                localStorage.setItem('tournamentData_v7', JSON.stringify(state));
            } catch (e) { console.error(e); }
        }

        function loadState() {
            const savedState = localStorage.getItem('tournamentData_v7');
            if (!savedState) {
                showScreen('setup');
                updatePlayerInputs();
                return;
            }
            try {
                const state = JSON.parse(savedState);
                if (state.allPlayers && state.selectedMatchesForTournament) {
                    allPlayers = state.allPlayers;
                    selectedMatchesForTournament = state.selectedMatchesForTournament;
                    MIN_MATCH_TARGET = state.MIN_MATCH_TARGET;
                    pointsConfig = state.pointsConfig || pointsConfig;
                    resumeBanner.classList.remove('hidden');
                    screens.setup.classList.add('active');
                    
                    // Pré-remplir les champs de réglages
                    if (pointsWinInput && pointsDrawInput && pointsLossInput) {
                        pointsWinInput.value = pointsConfig.win;
                        pointsDrawInput.value = pointsConfig.draw;
                        pointsLossInput.value = pointsConfig.loss;
                    }
                    if (matchTargetInput) {
                        matchTargetInput.value = MIN_MATCH_TARGET;
                    }
                }
            } catch (e) {
                localStorage.removeItem('tournamentData_v7'); 
                showScreen('setup');
                updatePlayerInputs();
            }
        }
        
        function resumeTournament() {
            resumeBanner.classList.add('hidden');
            showScreen('main');
            updateGenerationInfo();
            dashboardContent.classList.remove('hidden'); 
            renderAll();
        }

        function startNewFromResume() {
            resumeBanner.classList.add('hidden');
            clearState(); 
            showScreen('setup'); 
            updatePlayerInputs();
        }
        
        function clearState() {
            localStorage.removeItem('tournamentData_v7');
            allPlayers = [];
            selectedMatchesForTournament = [];
        }

        // --- LOGIQUE DE L'APPLICATION ---
        function showScreen(screenId) {
            Object.values(screens).forEach(screen => screen.classList.remove('active'));
            if (screens[screenId]) screens[screenId].classList.add('active');
        }

        function updatePlayerInputs() {
            const count = parseInt(playerCountSelect.value, 10);
            playerNamesContainer.innerHTML = ''; 
            for (let i = 1; i <= count; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = `Nom du Joueur ${i}`;
                input.className = 'w-full p-3 border border-slate-300 rounded-lg focus:ring-1 focus:ring-indigo-500 focus:outline-none';
                playerNamesContainer.appendChild(input);
            }
        }
        
        function updateGenerationInfo() {
             const finalCounts = allPlayers.map(p => 
                selectedMatchesForTournament.filter(m => 
                    m.teamA.players.some(pl => pl.name === p.name) || 
                    m.teamB.players.some(pl => pl.name === p.name)
                ).length
            );
            const minJ = (finalCounts.length > 0) ? Math.min(...finalCounts) : 0;
            const maxJ = (finalCounts.length > 0) ? Math.max(...finalCounts) : 0;
            generationInfo.textContent = `Tournoi généré avec ${selectedMatchesForTournament.length} matchs. Matchs joués: Min ${minJ}, Max ${maxJ}. Objectif: ${MIN_MATCH_TARGET} matchs. Barème: V${pointsConfig.win} / N${pointsConfig.draw} / D${pointsConfig.loss}.`;
        }

        async function startTournament() {
            const nameInputs = playerNamesContainer.querySelectorAll('input');
            const names = Array.from(nameInputs).map(input => input.value.trim());
            MIN_MATCH_TARGET = parseInt(matchTargetInput.value, 10);
            const winPoints = parseInt(pointsWinInput.value, 10);
            const drawPoints = parseInt(pointsDrawInput.value, 10);
            const lossPoints = parseInt(pointsLossInput.value, 10);

            const pointsInvalid = [winPoints, drawPoints, lossPoints].some(p => isNaN(p) || p < 0);
            if (isNaN(MIN_MATCH_TARGET) || MIN_MATCH_TARGET < 1) { showError('Objectif invalide.'); return; }
            if (pointsInvalid) { showError('Barème invalide.'); return; }
            if (winPoints === 0 && drawPoints === 0 && lossPoints === 0) { showError('Le barème doit donner au moins 1 point.'); return; }
            if (names.some(name => name === '')) { showError('Remplissez tous les noms.'); return; }
            const uniqueNames = new Set(names);
            if (uniqueNames.size !== names.length) { showError('Noms uniques requis.'); return; }

            showError(''); 
            showScreen('main');
            generationInfo.textContent = '';
            dashboardContent.classList.remove('hidden');

            pointsConfig = { win: winPoints, draw: drawPoints, loss: lossPoints };
            allPlayers = names.map(name => ({ name: name, matchResults: [] }));
            
            const allPossibleMatches = generateAllPossibleMatches();
            selectedMatchesForTournament = selectBalancedMatches(allPossibleMatches, allPlayers, MIN_MATCH_TARGET);
            
            updateGenerationInfo();
            renderAll();
            saveState(); 
        }

        function showError(message) { setupError.textContent = message; }

        function getCombinations(arr, k) {
            if (k === 0) return [[]]; if (arr.length === 0) return [];
            const firstEl = arr[0]; const rest = arr.slice(1);
            const combsWithFirst = getCombinations(rest, k - 1).map(combo => [firstEl, ...combo]);
            const combsWithoutFirst = getCombinations(rest, k);
            return [...combsWithFirst, ...combsWithoutFirst];
        }

        function generateAllPossibleMatches() {
            let generatedMatches = [];
            const matchSet = new Set(); 
            const allPossibleTeams = getCombinations(allPlayers, 3).map(players => {
                const sortedPlayers = [...players].sort((a, b) => a.name.localeCompare(b.name));
                return { players: sortedPlayers, id: sortedPlayers.map(p => p.name).join('-') };
            });

            for (let i = 0; i < allPossibleTeams.length; i++) {
                for (let j = i + 1; j < allPossibleTeams.length; j++) {
                    const teamA = allPossibleTeams[i]; const teamB = allPossibleTeams[j];
                    const teamAPlayerNames = teamA.players.map(p => p.name);
                    const hasOverlap = teamB.players.some(p => teamAPlayerNames.includes(p.name));
                    if (!hasOverlap) {
                        const playingPlayers = [...teamA.players, ...teamB.players];
                        const referees = allPlayers.filter(p => !playingPlayers.includes(p));
                        const matchId = [teamA.id, teamB.id].sort().join('_vs_');
                        if (!matchSet.has(matchId)) {
                            matchSet.add(matchId);
                            generatedMatches.push({
                                id: matchId, teamA, teamB, referees,
                                winner: null, scoreA: null, scoreB: null
                            });
                        }
                    }
                }
            }
            return generatedMatches;
        }
        
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function getPairKey(p1, p2) {
            return [p1.name, p2.name].sort().join('-');
        }

        function selectBalancedMatches(allMatches, players, minTarget) {
            let selectedMatches = [];
            let availableMatches = shuffle([...allMatches]);
            let playerCounts = new Map();
            players.forEach(p => playerCounts.set(p.name, 0));
            
            const teammatePairings = new Map();
            
            while (true) {
                let minGlobalCount = Math.min(...Array.from(playerCounts.values()));
                if (minGlobalCount >= minTarget || availableMatches.length === 0) {
                    break;
                }

                availableMatches.forEach(match => {
                    let repetitionScore = 0;
                    const teamA = match.teamA.players;
                    const teamB = match.teamB.players;

                    for (let i = 0; i < teamA.length; i++) {
                        for (let j = i + 1; j < teamA.length; j++) {
                            const key = getPairKey(teamA[i], teamA[j]);
                            repetitionScore += teammatePairings.get(key) || 0;
                        }
                    }
                    for (let i = 0; i < teamB.length; i++) {
                        for (let j = i + 1; j < teamB.length; j++) {
                            const key = getPairKey(teamB[i], teamB[j]);
                            repetitionScore += teammatePairings.get(key) || 0;
                        }
                    }
                    match.repetitionScore = repetitionScore;
                });

                availableMatches.sort((a, b) => {
                    if (a.repetitionScore !== b.repetitionScore) {
                        return a.repetitionScore - b.repetitionScore;
                    }

                    const playersA = [...a.teamA.players, ...a.teamB.players].map(p => playerCounts.get(p.name));
                    const playersB = [...b.teamA.players, ...b.teamB.players].map(p => playerCounts.get(p.name));
                    const maxA = Math.max(...playersA);
                    const maxB = Math.max(...playersB);
                    if (maxA !== maxB) return maxA - maxB;
                    
                    const sumA = playersA.reduce((s, c) => s + c, 0);
                    const sumB = playersB.reduce((s, c) => s + c, 0);
                    return sumA - sumB;
                });

                const selectedMatch = availableMatches.shift(); // Take the best match
                selectedMatches.push(selectedMatch);
                
                const matchPlayers = [...selectedMatch.teamA.players, ...selectedMatch.teamB.players];
                matchPlayers.forEach(p => playerCounts.set(p.name, playerCounts.get(p.name) + 1));

                const teamA = selectedMatch.teamA.players;
                for (let p_i = 0; p_i < teamA.length; p_i++) {
                    for (let p_j = p_i + 1; p_j < teamA.length; p_j++) {
                        const key = getPairKey(teamA[p_i], teamA[p_j]);
                        teammatePairings.set(key, (teammatePairings.get(key) || 0) + 1);
                    }
                }
                const teamB = selectedMatch.teamB.players;
                for (let p_i = 0; p_i < teamB.length; p_i++) {
                    for (let p_j = p_i + 1; p_j < teamB.length; p_j++) {
                        const key = getPairKey(teamB[p_i], teamB[p_j]);
                        teammatePairings.set(key, (teammatePairings.get(key) || 0) + 1);
                    }
                }
            }
            return selectedMatches;
        }

        function undoMatchResult(matchId) {
            const match = selectedMatchesForTournament.find(m => m.id === matchId);
            if (!match || !match.winner) return; 
            
            const matchPlayers = [...match.teamA.players, ...match.teamB.players];
            for (const player of allPlayers) {
                if (matchPlayers.some(p => p.name === player.name)) {
                    player.matchResults = player.matchResults.filter(r => r.matchId !== matchId);
                }
            }
            match.winner = null;
            match.scoreA = null;
            match.scoreB = null;
        }

        function handleScoreSubmission() {
            const scoreA = parseInt(modalScoreA.value, 10);
            const scoreB = parseInt(modalScoreB.value, 10);
            const matchId = currentMatchIdToScore;
            
            if (isNaN(scoreA) || isNaN(scoreB) || scoreA < 0 || scoreB < 0) {
                modalError.textContent = 'Scores invalides.'; return;
            }
            
            const match = selectedMatchesForTournament.find(m => m.id === matchId);
            if (match && match.winner) undoMatchResult(matchId);

            recordResult(matchId, scoreA, scoreB);
            closeScoreModal();
            renderAll();
        }

        function recordResult(matchId, scoreA, scoreB) {
            const match = selectedMatchesForTournament.find(m => m.id === matchId);
            if (!match || match.winner) return;

            justFinishedMatchId = match.id; // Set the state for the next render

            match.scoreA = scoreA;
            match.scoreB = scoreB;
            const { win, draw, loss } = pointsConfig;

            if (scoreA > scoreB) {
                match.winner = 'A';
                const winningTeam = match.teamA;
                const losingTeam = match.teamB;
                winningTeam.players.forEach(player => {
                    const p = allPlayers.find(ap => ap.name === player.name);
                    p.matchResults.push({ matchId: match.id, result: 'win', points: win, scoreFor: scoreA, scoreAgainst: scoreB });
                });
                losingTeam.players.forEach(player => {
                    const p = allPlayers.find(ap => ap.name === player.name);
                    p.matchResults.push({ matchId: match.id, result: 'loss', points: loss, scoreFor: scoreB, scoreAgainst: scoreA });
                });
            } else if (scoreB > scoreA) {
                match.winner = 'B';
                const winningTeam = match.teamB;
                const losingTeam = match.teamA;
                winningTeam.players.forEach(player => {
                    const p = allPlayers.find(ap => ap.name === player.name);
                    p.matchResults.push({ matchId: match.id, result: 'win', points: win, scoreFor: scoreB, scoreAgainst: scoreA });
                });
                losingTeam.players.forEach(player => {
                    const p = allPlayers.find(ap => ap.name === player.name);
                    p.matchResults.push({ matchId: match.id, result: 'loss', points: loss, scoreFor: scoreA, scoreAgainst: scoreB });
                });
            } else { // Draw
                match.winner = 'D'; // D for Draw
                match.teamA.players.forEach(player => {
                    const p = allPlayers.find(ap => ap.name === player.name);
                    p.matchResults.push({ matchId: match.id, result: 'draw', points: draw, scoreFor: scoreA, scoreAgainst: scoreB });
                });
                match.teamB.players.forEach(player => {
                    const p = allPlayers.find(ap => ap.name === player.name);
                    p.matchResults.push({ matchId: match.id, result: 'draw', points: draw, scoreFor: scoreB, scoreAgainst: scoreA });
                });
            }

            saveState(); 
        }

            });
            
            const sortedPlayers = playerStats.sort((a, b) => {

        function openStatsModal(playerName) {
            const player = allPlayers.find(p => p.name === playerName);
            if (!player) return;
            
            statsModalTitle.textContent = `Stats pour ${player.name}`;
            statsModalContent.innerHTML = ''; 

            const results = player.matchResults;
            const wins = results.filter(r => r.result === 'win').length;
            const draws = results.filter(r => r.result === 'draw').length;
            const losses = results.filter(r => r.result === 'loss').length;
            const played = results.length;
            const totalPoints = results.reduce((acc, r) => acc + r.points, 0);
            const gaTotal = results.reduce((acc, r) => acc + (r.scoreFor - r.scoreAgainst), 0);
            const gaAverage = played ? (gaTotal / played).toFixed(1) : '0';
            const winRate = played ? Math.round((wins / played) * 100) : 0;

            function computeStreak(list) {
                if (list.length === 0) return '—';
                const last = list[list.length - 1].result;
                let count = 0;
                for (let i = list.length - 1; i >= 0; i--) {
                    if (list[i].result === last) count++; else break;
                }
                const label = last === 'win' ? 'V' : last === 'draw' ? 'N' : 'D';
                return `${count}${label} en cours`;
            }

            function summarizePartners(matches) {
                const teammateStats = new Map();
                const opponentStats = new Map();

                matches.forEach(match => {
                    if (match.winner === null) return;
                    const isOnTeamA = match.teamA.players.some(p => p.name === playerName);
                    const playerTeam = isOnTeamA ? match.teamA.players : match.teamB.players;
                    const otherTeamPlayers = isOnTeamA ? match.teamB.players : match.teamA.players;
                    const playerWon = (match.winner === 'A' && isOnTeamA) || (match.winner === 'B' && !isOnTeamA);
                    const isDraw = match.winner === 'D';

                    playerTeam.forEach(p => {
                        if (p.name === playerName) return;
                        const entry = teammateStats.get(p.name) || { wins: 0, draws: 0, losses: 0, matches: 0 };
                        entry.matches += 1;
                        if (playerWon) entry.wins += 1;
                        else if (isDraw) entry.draws += 1;
                        else entry.losses += 1;
                        teammateStats.set(p.name, entry);
                    });

                    otherTeamPlayers.forEach(p => {
                        const entry = opponentStats.get(p.name) || { wins: 0, draws: 0, losses: 0, matches: 0 };
                        entry.matches += 1;
                        if (playerWon) entry.losses += 1;
                        else if (isDraw) entry.draws += 1;
                        else entry.wins += 1;
                        opponentStats.set(p.name, entry);
                    });
                });

                const bestTeammate = Array.from(teammateStats.entries()).sort((a, b) => {
                    if (a[1].wins !== b[1].wins) return b[1].wins - a[1].wins;
                    return b[1].matches - a[1].matches;
                })[0];

                const nemesis = Array.from(opponentStats.entries()).sort((a, b) => {
                    if (a[1].wins !== b[1].wins) return b[1].wins - a[1].wins;
                    return b[1].matches - a[1].matches;
                })[0];

                return {
                    bestTeammate: bestTeammate ? `${bestTeammate[0]} (${bestTeammate[1].wins}V/${bestTeammate[1].matches}m)` : 'Pas encore de partenaire fétiche',
                    nemesis: nemesis ? `${nemesis[0]} (${nemesis[1].wins} défaites contre)` : 'Pas de bête noire',
                };
            }

            const streak = computeStreak(results);
            const playerMatches = selectedMatchesForTournament.filter(m => 
                m.teamA.players.some(p => p.name === playerName) || m.teamB.players.some(p => p.name === playerName)
            );
            const partnerSummary = summarizePartners(playerMatches);

            const summaryBlock = document.createElement('div');
            summaryBlock.className = 'grid grid-cols-1 md:grid-cols-2 gap-3 mb-4';
            summaryBlock.innerHTML = `
                <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                    <p class="text-xs font-semibold uppercase text-indigo-600 tracking-wide mb-1">Bilan</p>
                    <p class="text-2xl font-bold text-slate-800">${wins}V - ${draws}N - ${losses}D</p>
                    <p class="text-sm text-slate-500">${played} matchs · ${winRate}% de victoires</p>
                </div>
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 flex flex-col gap-1">
                    <p class="text-xs font-semibold uppercase text-slate-500 tracking-wide">Points / GA</p>
                    <p class="text-lg font-semibold text-slate-800">${totalPoints} pts (barème V${pointsConfig.win}/N${pointsConfig.draw}/D${pointsConfig.loss})</p>
                    <p class="text-sm text-slate-600">Goal average total: ${gaTotal > 0 ? '+' + gaTotal : gaTotal} · Moyen: ${gaAverage}</p>
                    <p class="text-sm text-slate-600">Série actuelle: ${streak}</p>
                    <p class="text-sm text-slate-600">Coéquipier clé: ${partnerSummary.bestTeammate}</p>
                    <p class="text-sm text-slate-600">Bête noire: ${partnerSummary.nemesis}</p>
                </div>
            `;
            statsModalContent.appendChild(summaryBlock);

            if (playerMatches.length === 0) {
                statsModalContent.innerHTML = '<p class="text-slate-500">Pas encore de matchs.</p>';
            } else {
                playerMatches.sort((a,b) => (a.winner === null ? -1 : 1));
                playerMatches.forEach(match => {
                    const isOnTeamA = match.teamA.players.some(p => p.name === playerName);
                    const playerTeam = isOnTeamA ? match.teamA : match.teamB;
                    const otherTeam = isOnTeamA ? match.teamB : match.teamA;
                    const partners = playerTeam.players.filter(p => p.name !== playerName).map(p => p.name).join(', ');
                    
                    let resultHTML = match.winner === null ? `<span class="text-slate-500">À jouer</span>` :
                        ((match.winner === 'A' && isOnTeamA) || (match.winner === 'B' && !isOnTeamA)) ? 
                        `<span class="text-green-600 font-bold">VICTOIRE</span> (${match.scoreA}-${match.scoreB})` : 
                        `<span class="text-red-600 font-bold">DÉFAITE</span> (${match.scoreA}-${match.scoreB})`;
                    
                    const div = document.createElement('div');
                    div.className = 'p-3 border border-slate-200 rounded-lg bg-slate-50';
                    div.innerHTML = `<p class="text-indigo-700 font-medium">Avec : ${partners}</p><p class="text-sm">Contre : ${otherTeam.players.map(p => p.name).join(', ')}</p><p class="text-sm mt-1">${resultHTML}</p>`;
                    statsModalContent.appendChild(div);
                });
            }
            statsModal.classList.remove('hidden');
            setTimeout(() => { statsModal.classList.remove('opacity-0'); statsModalPanel.classList.remove('opacity-0', 'scale-95'); }, 10);
        }

        function closeStatsModal() {
            statsModal.classList.add('opacity-0'); statsModalPanel.classList.add('opacity-0', 'scale-95');
            setTimeout(() => statsModal.classList.add('hidden'), 300);
        }

        // --- LISTENERS ---
        playerCountSelect.addEventListener('change', updatePlayerInputs);
        startButton.addEventListener('click', startTournament);
        resetButton.addEventListener('click', resetApp);
        copyScoreboardButton.addEventListener('click', () => {
            // Logique de copie simplifiée
            alert("Fonctionnalité de copie simulée (pour l'instant).");
        });

        modalCancelButton.addEventListener('click', closeScoreModal);
        modalConfirmButton.addEventListener('click', handleScoreSubmission);
        scoreModal.addEventListener('click', (e) => { if (e.target === scoreModal) closeScoreModal(); });
        
        statsModal.addEventListener('click', (e) => { if (e.target === statsModal) closeStatsModal(); });
        statsModalCloseButton.addEventListener('click', closeStatsModal);
        
        resumeContinueButton.addEventListener('click', resumeTournament);
        resumeNewButton.addEventListener('click', startNewFromResume);
        
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const { action, matchId, playerName } = btn.dataset;
            if (action === 'score') openScoreModal(matchId);
            if (action === 'edit') openScoreModal(matchId);
            if (action === 'stats') openStatsModal(playerName);
            if (action === 'next-match') {
                justFinishedMatchId = null;
                renderAll();
            }
        });

        loadState();
    </script>
</body>
</html>
